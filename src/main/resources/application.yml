server:
  port: ${SERVER_PORT:8080}

spring:
  profiles:
    default: local
  application:
    name: ${APP_NAME:finassist-mini}

  ai:
    ollama:
      embedding:
        model: ${EMBEDDING_MODEL:nomic-embed-text}
      chat:
        model: ${LLM_MODEL:gemma2:2b}
        options:
          num-predict: 512

  vectorstore:
    pgvector:
      index-type: HNSW
      distance-type: COSINE_DISTANCE
      similarity-threshold: 0.5
      dimensions: 768
      initialize-schema: true

  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_UPLOAD_SIZE_MB:25}MB
      max-request-size: ${MAX_UPLOAD_SIZE_MB:25}MB

  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  docs-directory: ${DOCS_DIRECTORY:data/documents}
  retrieval-k: ${RETRIEVAL_K:3}
  chunk-size-words: ${CHUNK_SIZE_WORDS:350}
  chunk-overlap-words: ${CHUNK_OVERLAP_WORDS:35}
  max-prompt-chars: ${MAX_PROMPT_CHARS:6000}
  upload-write-chunk-bytes: ${UPLOAD_WRITE_CHUNK_BYTES:1048576}
  upload-max-concurrency: ${UPLOAD_MAX_CONCURRENCY:1}
  chat-max-concurrency: ${CHAT_MAX_CONCURRENCY:1}
  admission-wait-seconds: ${ADMISSION_WAIT_SECONDS:1.0}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true

logging:
  level:
    org.springframework.ai: INFO
    com.finassistmini: DEBUG

repository:
  storage-path: ${REPOSITORY_STORAGE_PATH:storage/repositories}
  max-file-size-bytes: 1048576       # 1 MB
  max-files-per-repo: 2000
  max-depth: 20
  clone-timeout-seconds: 120
  summary-enabled: true
  async-enabled: true
  allowed-extensions:
    - java
    - kt
    - py
    - js
    - ts
    - go
    - rs
    - c
    - cpp
    - cs
    - yaml
    - yml
    - json
    - xml
    - md
    - properties
    - sql
    - gradle
    - kts
    - dockerfile
    - txt
  ignored-directories:
    - .git
    - node_modules
    - target
    - build
    - dist
    - coverage
    - .idea
    - .vscode
    - bin
    - obj
    - vendor
    - logs
    - tmp
    - generated
    - __pycache__
    - .gradle
    - .mvn

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
