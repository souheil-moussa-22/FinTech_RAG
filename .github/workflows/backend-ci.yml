name: Backend CI

on:
  push:
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/backend-ci.yml'

# Cancel in-progress runs for the same branch to save minutes
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  compile:
    name: Compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile project
        run: mvn --batch-mode --no-transfer-progress compile

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: compile

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fintech_rag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run unit tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/fintech_rag_test
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SPRING_AI_OLLAMA_BASE_URL: http://localhost:11434
          KEYCLOAK_SERVER_URL: http://localhost:8180
        run: |
          mvn --batch-mode --no-transfer-progress test \
            -Dspring.profiles.active=test

      - name: Publish test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-report
          path: target/surefire-reports/
          retention-days: 7

  package:
    name: Package JAR
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR (skip tests — already ran)
        run: |
          mvn --batch-mode --no-transfer-progress package \
            -DskipTests \
            -Dspring.profiles.active=prod

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: target/*.jar
          retention-days: 7