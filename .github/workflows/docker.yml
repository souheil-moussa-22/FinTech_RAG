name: Docker Validation

on:
  push:
    paths:
      - 'Dockerfile'
      - 'finassist-frontend/Dockerfile'
      - 'docker-compose.yml'
      - 'src/**'
      - 'finassist-frontend/**'
      - '.github/workflows/docker.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'finassist-frontend/Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/docker.yml'

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build-backend-image:
    name: Build Backend Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false              # Validation only — no push
          tags: finassist-backend:ci
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  build-frontend-image:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./finassist-frontend
          file: ./finassist-frontend/Dockerfile
          push: false
          tags: finassist-frontend:ci
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  validate-compose:
    name: Validate docker-compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker Compose version
        run: docker compose version

      - name: Validate docker-compose.yml syntax
        run: docker compose config --quiet

      - name: Check required environment variables documented
        run: |
          echo "Checking that .env.example exists..."
          test -f .env.example || (echo "ERROR: .env.example is missing" && exit 1)
          echo "✅ .env.example present"